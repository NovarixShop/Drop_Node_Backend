name: Deploy Backend to Hostinger VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Linter Check
        run: npm run lint

      - name: Verify Microservices Production Compilation
        run: npm run build:all

  deploy:
    name: Sync & Deploy to Hostinger VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Verify Hostinger Secrets Configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_HOST }}" ] || ( [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] ); then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning title=Hostinger Secrets Pending::HOSTINGER_SSH_HOST and either HOSTINGER_SSH_KEY or HOSTINGER_SSH_PASSWORD must be set in repository Settings -> Secrets and variables -> Actions. Skipping VPS deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Hostinger VPS via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.HOSTINGER_BACKEND_DIR || '/var/www/Drop_Node_Backend' }}"
            echo "🚀 Deploying Backend to $TARGET_DIR on Hostinger VPS..."
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory $TARGET_DIR does not exist. Creating and cloning..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            
            # Ensure origin points to the triggering repository and sync latest main
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            # Ensure .env.local exists so docker-compose doesn't fail
            if [ ! -f ".env.local" ]; then
              echo "⚠️ .env.local not found on VPS. Initializing from .env.example..."
              cp .env.example .env.local
            fi

            # Auto-repair required production secrets if missing or empty
            echo "🔐 Verifying and securing production environment variables..."
            if ! grep -q "^JWT_SECRET=.\{32,\}" .env.local; then
              echo "🔑 Generating secure JWT_SECRET..."
              sed -i '/^JWT_SECRET=/d' .env.local
              echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env.local
            fi
            if ! grep -q "^JWT_REFRESH_SECRET=.\{32,\}" .env.local; then
              echo "🔑 Generating secure JWT_REFRESH_SECRET..."
              sed -i '/^JWT_REFRESH_SECRET=/d' .env.local
              echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> .env.local
            fi
            if ! grep -q "^INTERNAL_API_KEY=.\{32,\}" .env.local; then
              echo "🔑 Generating secure INTERNAL_API_KEY..."
              sed -i '/^INTERNAL_API_KEY=/d' .env.local
              echo "INTERNAL_API_KEY=$(openssl rand -hex 32)" >> .env.local
            fi
            if ! grep -q "^CORS_ORIGINS=.\+" .env.local; then
              echo "🌐 Setting default CORS_ORIGINS..."
              sed -i '/^CORS_ORIGINS=/d' .env.local
              echo "CORS_ORIGINS=https://novarixshop.tech,https://admin.novarixshop.tech,https://cms.novarixshop.tech,http://localhost:3000,http://localhost:3001" >> .env.local
            elif ! grep -q "admin\.novarixshop\.tech" .env.local; then
              echo "🌐 Adding admin.novarixshop.tech to CORS_ORIGINS..."
              sed -i 's/^CORS_ORIGINS=/CORS_ORIGINS=https:\/\/admin.novarixshop.tech,/' .env.local
            fi

            # Auto-configure MongoDB and Redis URIs if dummy example or empty
            if grep -q "cluster.example.mongodb.net" .env.local || ! grep -q "^MONGODB_URI=.\+" .env.local; then
              echo "🗄️ Configuring MongoDB URI to Docker mongo container..."
              sed -i '/^MONGODB_URI=/d' .env.local
              echo "MONGODB_URI=mongodb://mongo:27017/ecommerce" >> .env.local
            fi
            if grep -q "redis.example.com" .env.local || ! grep -q "^REDIS_URL=.\+" .env.local; then
              echo "🧠 Configuring Redis URL to Docker redis container..."
              sed -i '/^REDIS_URL=/d' .env.local
              echo "REDIS_URL=redis://redis:6379" >> .env.local
            fi
            
            # Rebuild and restart Docker containers if docker-compose exists
            if [ -f "docker-compose.yml" ]; then
              echo "🐳 Rebuilding and restarting Docker containers..."
              docker compose up -d --build --remove-orphans
              docker image prune -f
              sleep 6
              echo "📊 Container status:"
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "📦 Installing dependencies and compiling..."
              npm ci
              npm run build:all
              if command -v pm2 &> /dev/null; then
                pm2 restart backend || pm2 start dist/server.js --name "backend"
                pm2 save
              fi
            fi

            echo "🔍 Auth service recent logs:"
            docker logs ecommerce_auth_service --tail 25 2>&1 || true

            echo "🔍 API Gateway recent logs:"
            docker logs ecommerce_api_gateway --tail 25 2>&1 || true

            # Seed Super Admin
            echo "🌱 Seeding Super Admin (novarixshop5@gmail.com)..."
            npm install --production --no-audit --no-fund mongoose bcryptjs dotenv || true
            node scripts/seed-admin.js || echo "⚠️ Seed script completed with notice"
            
            echo "✅ Backend deployment complete!"
