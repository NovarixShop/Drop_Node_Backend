services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:6.0
    container_name: ecommerce_mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    mem_limit: 384m

  # 2. Redis Cache & Event Bus Container
  redis:
    image: redis:7.0-alpine
    container_name: ecommerce_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    mem_limit: 128m

  # 3. Central API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce_api_gateway
    ports:
      - "127.0.0.1:5010:5000"
    env_file:
      - .env.local
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - CART_SERVICE_URL=http://cart-service:5003
      - ORDER_SERVICE_URL=http://order-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
      - CONTENT_SERVICE_URL=http://content-service:5006
      - NODE_OPTIONS=--max-old-space-size=96
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - notification-service
      - content-service
    restart: always
    mem_limit: 128m

  # 4. Auth & User Microservice (Port 5001)
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce_auth_service

    env_file:
      - .env.local
    environment:
      - PORT=5001
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    depends_on:
      - mongo
      - redis
    mem_limit: 192m

  # 5. Catalog & Product Microservice (Port 5002)
  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: ecommerce_catalog_service

    env_file:
      - .env.local
    environment:
      - PORT=5002
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
      - UPLOAD_DIR=/app/uploads
      - CONTENT_SERVICE_URL=http://content-service:5006
    volumes:
      # Uploaded product images; a named volume so they survive rebuilds/redeploys. Back it up!
      - product_uploads:/app/uploads
    restart: always
    depends_on:
      - mongo
      - redis
    # Extra headroom for decoding/re-encoding uploaded photos (sharp/libvips works outside the JS heap)
    mem_limit: 384m

  # 6. Cart & Wishlist Microservice (Port 5003)
  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: ecommerce_cart_service

    env_file:
      - .env.local
    environment:
      - PORT=5003
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - catalog-service
      - mongo
      - redis
    restart: always
    mem_limit: 192m

  # 7. Order & Checkout Microservice (Port 5004)
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ecommerce_order_service

    env_file:
      - .env.local
    environment:
      - PORT=5004
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CART_SERVICE_URL=http://cart-service:5003
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - AUTH_SERVICE_URL=http://auth-service:5001
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - mongo
      - redis
    restart: always
    mem_limit: 192m

  # 8. Notification Microservice & Worker (Port 5005)
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ecommerce_notification_service

    env_file:
      - .env.local
    environment:
      - PORT=5005
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    depends_on:
      - mongo
      - redis
    mem_limit: 192m

  # 9. Content & CMS Microservice (Port 5006)
  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: ecommerce_content_service

    env_file:
      - .env.local
    environment:
      - PORT=5006
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    depends_on:
      - mongo
      - redis
    mem_limit: 192m

volumes:
  mongo-data:
  redis-data:
  product_uploads:
