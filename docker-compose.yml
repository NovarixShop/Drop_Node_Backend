version: '3.8'

services:
  # 3. Central API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce_api_gateway
    ports:
      - "127.0.0.1:5010:5000"
    env_file:
      - .env.local
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - CART_SERVICE_URL=http://cart-service:5003
      - ORDER_SERVICE_URL=http://order-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
      - CONTENT_SERVICE_URL=http://content-service:5006
      - NODE_OPTIONS=--max-old-space-size=96
    depends_on:
      - auth-service
      - catalog-service
      - cart-service
      - order-service
      - notification-service
      - content-service
    restart: always
    mem_limit: 128m

  # 4. Auth & User Microservice (Port 5001)
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce_auth_service

    env_file:
      - .env.local
    environment:
      - PORT=5001
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    mem_limit: 192m

  # 5. Catalog & Product Microservice (Port 5002)
  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: ecommerce_catalog_service

    env_file:
      - .env.local
    environment:
      - PORT=5002
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    mem_limit: 192m

  # 6. Cart & Wishlist Microservice (Port 5003)
  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: ecommerce_cart_service

    env_file:
      - .env.local
    environment:
      - PORT=5003
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - catalog-service
    restart: always
    mem_limit: 192m

  # 7. Order & Checkout Microservice (Port 5004)
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ecommerce_order_service

    env_file:
      - .env.local
    environment:
      - PORT=5004
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CART_SERVICE_URL=http://cart-service:5003
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    depends_on:
      - catalog-service
      - cart-service
    restart: always
    mem_limit: 192m

  # 8. Notification Microservice & Worker (Port 5005)
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ecommerce_notification_service

    env_file:
      - .env.local
    environment:
      - PORT=5005
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    mem_limit: 192m

  # 9. Content & CMS Microservice (Port 5006)
  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: ecommerce_content_service

    env_file:
      - .env.local
    environment:
      - PORT=5006
      - NODE_ENV=production
      - REDIS_ENABLED=true
      - CLIENT_URL=http://api-gateway:5000
      - NODE_OPTIONS=--max-old-space-size=128
    restart: always
    mem_limit: 192m
